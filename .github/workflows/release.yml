name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win }
          - { os: macos-latest,   name: mac }
          - { os: ubuntu-latest,  name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Bundle engines (yt-dlp + gallery-dl)
        shell: bash
        run: |
          mkdir -p bin
          case "${{ matrix.name }}" in
            win)   YT=yt-dlp.exe;   EXT=.exe ;;
            mac)   YT=yt-dlp_macos; EXT=""   ;;
            linux) YT=yt-dlp_linux; EXT=""   ;;
          esac
          curl -fsSL -o "bin/yt-dlp$EXT" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/$YT"
          pip install gallery-dl pyinstaller
          printf 'from gallery_dl import main\nmain()\n' > gdl_entry.py
          pyinstaller --onefile --name gallery-dl --collect-all gallery_dl --distpath gdlbuild gdl_entry.py
          cp "gdlbuild/gallery-dl$EXT" "bin/gallery-dl$EXT"
          chmod +x bin/* || true
          ls -la bin

      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: hoardr-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: assets/*
